[package]
name = "ac"
version = "0.12.8"
edition = "2021"
description = "Unofficial ActiveCollab CLI, terminal UI and MCP server: read tasks, log time and export hours from the terminal or an AI coding agent"
license = "MIT"
repository = "https://github.com/ejklock/active-collab-cli"
homepage = "https://github.com/ejklock/active-collab-cli"
readme = "README.md"
keywords = ["activecollab", "cli", "tui", "mcp", "project-management"]
categories = ["command-line-utilities"]

[[bin]]
name = "ac"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# "string" lets the command name be set at runtime from argv[0] (the ac alias).
clap = { version = "4", features = ["derive", "string"] }
bytes = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
html-escape = "0.2"
ratatui = "0.29"
tui-textarea = "0.7"
unicode-width = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1"
rpassword = "7"
url = "2"

arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

rust_xlsxwriter = { version = "0.102", features = ["chrono"] }

rmcp = { version = "3.9.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["client", "transport-child-process"] }
calamine = { version = "0.37", features = ["dates"] }
tempfile = "3"
wiremock = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
